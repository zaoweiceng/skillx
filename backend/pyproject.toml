[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skillx-workflow"
version = "0.1.0"
description = "SkillX visual workflow platform"
requires-python = ">=3.12,<3.14"
dependencies = [
  "aiosqlite>=0.20,<1",
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "jsonschema[format]>=4.23,<5",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pyyaml>=6.0,<7",
  "sqlalchemy[asyncio]>=2.0.41,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
skillx-worker = "app.worker:main"
skillx-seed = "app.seed:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.0,<2",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["ASYNC240", "B008"]
